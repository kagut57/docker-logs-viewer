<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Logs</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('dlv-theme') || 'dark'; } catch (e) {}</script>
<style>
  :root, [data-theme="dark"] {
    --bg:#0d1117; --panel:#161b22; --hover:#1c232c; --sel:#1f2a37; --line:#30363d; --fg:#e6edf3; --mute:#8b949e; --acc:#58a6ff;
    --err:#ff7b72; --warn:#e3b341; --info:#58a6ff; --debug:#a5a5a5; --ok:#3fb950; --str:#a5d6ff; --num:#79c0ff; --url:#d2a8ff; --key:#ffa657;
    --errbg:rgba(248,81,73,.08); --warnbg:rgba(210,153,34,.07); --mark:#9e6a03; --markfg:#fff;
    --a0:#484f58; --a1:#ff7b72; --a2:#3fb950; --a3:#d29922; --a4:#58a6ff; --a5:#bc8cff; --a6:#39c5cf; --a7:#b1bac4;
    --a8:#6e7681; --a9:#ffa198; --a10:#56d364; --a11:#e3b341; --a12:#79c0ff; --a13:#d2a8ff; --a14:#56d4dd; --a15:#ffffff;
  }
  [data-theme="black"] {
    --bg:#000; --panel:#0a0a0a; --hover:#151515; --sel:#1a1a1a; --line:#262626; --fg:#f0f0f0; --mute:#8a8a8a; --acc:#ffffff;
    --err:#ff5c5c; --warn:#ffcc33; --info:#5cb8ff; --debug:#9a9a9a; --ok:#4ade80; --str:#9fd8ff; --num:#8cc8ff; --url:#d8b4fe; --key:#ffb86b;
    --errbg:rgba(255,60,60,.10); --warnbg:rgba(255,204,51,.07); --mark:#fff; --markfg:#000;
    --a0:#4d4d4d; --a1:#ff5c5c; --a2:#4ade80; --a3:#ffcc33; --a4:#5cb8ff; --a5:#c084fc; --a6:#22d3ee; --a7:#d4d4d4;
    --a8:#737373; --a9:#ff8a8a; --a10:#86efac; --a11:#fde047; --a12:#93c5fd; --a13:#d8b4fe; --a14:#67e8f9; --a15:#ffffff;
  }
  [data-theme="white"] {
    --bg:#ffffff; --panel:#f6f8fa; --hover:#eef1f4; --sel:#e7eef8; --line:#d0d7de; --fg:#1f2328; --mute:#656d76; --acc:#0969da;
    --err:#cf222e; --warn:#9a6700; --info:#0969da; --debug:#6e7781; --ok:#1a7f37; --str:#0a3069; --num:#0550ae; --url:#8250df; --key:#953800;
    --errbg:rgba(207,34,46,.06); --warnbg:rgba(154,103,0,.06); --mark:#fff8c5; --markfg:#1f2328;
    --a0:#24292f; --a1:#cf222e; --a2:#1a7f37; --a3:#9a6700; --a4:#0969da; --a5:#8250df; --a6:#1b7c83; --a7:#6e7781;
    --a8:#57606a; --a9:#a40e26; --a10:#2da44e; --a11:#bf8700; --a12:#218bff; --a13:#a475f9; --a14:#3192aa; --a15:#8c959f;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; height:100dvh; display:flex; }
  #side { width:280px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; flex-shrink:0; }
  #side h1 { font-size:14px; margin:0; padding:14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #side h1 svg { width:18px; height:18px; fill:var(--acc); }
  .c { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; border-left:3px solid transparent; }
  .c:hover { background:var(--hover); } .c.sel { background:var(--sel); border-left-color:var(--acc); }
  .c .n { font-weight:600; display:flex; align-items:center; gap:8px; }
  .c .s { color:var(--mute); font-size:12px; margin-top:2px; word-break:break-all; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--a8); flex-shrink:0; }
  .dot.running { background:var(--ok); } .dot.exited, .dot.dead { background:var(--err); } .dot.restarting, .dot.paused { background:var(--warn); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { display:flex; gap:8px; padding:8px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; align-items:center; }
  #bar input, #bar select, #bar button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  #bar input { flex:1; min-width:120px; } #bar button { cursor:pointer; } #bar button:hover, #bar select:hover { border-color:var(--acc); }
  #bar button.on { border-color:var(--acc); color:var(--acc); }
  #title { color:var(--mute); padding:0 4px; font-weight:600; }
  #count { color:var(--mute); font-size:12px; padding:0 4px; white-space:nowrap; }
  #logwrap { flex:1; min-height:0; position:relative; display:flex; }
  #newer { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:2; background:var(--acc); color:var(--bg); border:0; border-radius:999px; padding:6px 14px; font:600 12px system-ui,sans-serif; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  #newer[hidden] { display:none; }
  #logwrap.asc #newer { top:auto; bottom:14px; }
  #log { flex:1; min-width:0; overflow:auto; overflow-anchor:none; -webkit-overflow-scrolling:touch; padding:8px 0; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre; }
  #log.wrap { white-space:pre-wrap; word-break:break-all; }
  .ln { padding:0 12px; border-left:3px solid transparent; }
  .ln:hover { background:var(--hover); }
  .ln.err, .ln.lv-error, .ln.lv-fatal { color:var(--err); }
  .ln.lv-error, .ln.lv-fatal { background:var(--errbg); border-left-color:var(--err); }
  .ln.lv-warn { background:var(--warnbg); border-left-color:var(--warn); }
  .ln.sys { color:var(--mute); font-style:italic; }
  .ts { color:var(--mute); }
  .lv { font-weight:700; }
  .lv.error, .lv.fatal { color:var(--err); } .lv.warn { color:var(--warn); } .lv.info { color:var(--info); } .lv.debug, .lv.trace { color:var(--debug); }
  .t-str { color:var(--str); } .t-num { color:var(--num); } .t-url { color:var(--url); } .t-key { color:var(--key); }
  .t-meth { color:var(--a5); font-weight:600; } .t-s2 { color:var(--ok); font-weight:600; } .t-s3 { color:var(--a6); font-weight:600; }
  .t-s4 { color:var(--warn); font-weight:600; } .t-s5 { color:var(--err); font-weight:600; }
  .b { font-weight:700; } .d { opacity:.7; } .i { font-style:italic; } .u { text-decoration:underline; }
  mark { background:var(--mark); color:var(--markfg); border-radius:2px; }
  #log { font-size:var(--logfs, 12px); touch-action:pan-x pan-y; }
  #zoomtip { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:3; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font:600 14px system-ui,sans-serif; pointer-events:none; opacity:0; transition:opacity .2s; }
  #zoomtip.show { opacity:.95; }
  #menu { display:none; }
  #shade { display:none; }
  #bar { position:relative; }
  #bar input { order:1; }
  #count { order:2; }
  #opts { order:3; display:inline-flex; align-items:center; gap:6px; }
  #opts svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  #opts svg circle { fill:var(--bg); }
  body.sheet #opts { border-color:var(--acc); color:var(--acc); }
  #tools { position:absolute; top:calc(100% + 6px); right:8px; width:380px; z-index:8; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px 14px; display:none; grid-template-columns:1fr 1fr; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,.35); }
  body.sheet #tools { display:grid; }
  body.sheet #sheetshade { display:block; position:fixed; inset:0; z-index:7; }
  #sheetshade { display:none; }
  #sheethead { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; font-weight:700; padding:2px 0; }
  #bar #optsclose { border:0; background:none; padding:4px 8px; color:var(--mute); }
  .opt { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mute); }
  #bar .opt select { width:100%; }
  #bar #tools button { width:100%; }
  .zoomopt { grid-column:1 / -1; }
  .zoom { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  #bar .zoom button { font-weight:700; }
  #ctl { grid-column:1 / -1; border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:10px; }
  #ctl[hidden] { display:none; }
  .ctlhead { display:flex; align-items:center; gap:8px; min-width:0; }
  .ctlhead b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ctlstate { color:var(--mute); font-size:12px; margin-left:auto; white-space:nowrap; }
  .ctlbtns { display:flex; gap:8px; }
  #bar .ctlbtns button { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:600; }
  #bar .ctlbtns button[hidden] { display:none; }
  .ctlbtns svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  #bar .ctlbtns button.danger { color:var(--err); }
  #bar .ctlbtns button.danger:hover { border-color:var(--err); }
  #bar .ctlbtns button:disabled { opacity:.55; cursor:progress; }
  #modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  #modal[hidden] { display:none; }
  .mbox { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:20px; width:min(400px,100%); box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .mbox h3 { margin:0 0 8px; font-size:17px; }
  .mbox p { margin:0 0 18px; color:var(--mute); line-height:1.5; word-break:break-word; }
  .mbox p b { color:var(--fg); }
  .mbtns { display:flex; gap:10px; justify-content:flex-end; }
  .mbtns button { font:inherit; font-weight:600; border-radius:8px; padding:9px 16px; cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #mok { background:var(--acc); border-color:var(--acc); color:var(--bg); }
  #mok.danger { background:var(--err); border-color:var(--err); color:#fff; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); z-index:21; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px); }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #toast.bad { border-color:var(--err); color:var(--err); }
  @media (max-width:700px) {
    body { font-size:15px; }
    #side { position:fixed; top:0; bottom:0; left:0; width:min(320px,85vw); z-index:6; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 24px rgba(0,0,0,.4); }
    #side.open { transform:none; }
    #shade { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:5; }
    #side.open + #shade { display:block; }
    .c { padding:14px 16px; }
    #menu { display:inline-flex; align-items:center; }
    #bar { gap:6px; padding:6px; }
    #bar input, #bar select, #bar button { padding:8px 10px; min-height:38px; }
    #bar input { order:10; flex:1 1 100%; font-size:16px; }
    #title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #count { order:11; flex-basis:100%; padding:0 2px; }
    #count:empty { display:none; }
    #tools { position:fixed; top:auto; left:0; right:0; bottom:0; width:auto; border-width:1px 0 0; border-radius:16px 16px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom)); display:grid; transform:translateY(105%); transition:transform .22s ease; box-shadow:0 -8px 30px rgba(0,0,0,.35); max-height:80dvh; overflow:auto; }
    body.sheet #tools { transform:none; }
    body.sheet #sheetshade { background:rgba(0,0,0,.45); }
    #sheethead { padding:4px 0; }
    #sheethead::before { content:''; position:absolute; top:6px; left:50%; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:var(--line); }
    #bar #optsclose { min-height:0; padding:6px 8px; }
    .ln { padding:0 8px; }
    .ts-date, .ts-frac { display:none; }
  }
</style>
</head>
<body>
<div id="side"><h1><svg viewBox="0 0 24 24"><path d="M13 4h3v3h-3zM9 4h3v3H9zM9 8h3v3H9zM5 8h3v3H5zM13 8h3v3h-3zM5 12h3v3H5zM9 12h3v3H9zM13 12h3v3h-3zM17 12h3v3h-3zM22.6 11.2c-.6-.4-1.9-.6-2.9-.4-.1-1-.7-1.9-1.6-2.6l-.5-.4-.4.5c-.5.8-.7 2-.6 2.9.1.4.2.8.4 1.1-.6.3-1.6.4-1.8.4H1.1l-.1.5c-.1 1.6.1 3.2.8 4.6.8 1.4 2 2.5 3.6 3 1.9.6 3.8.6 5.7.3 1.6-.3 3.2-.9 4.5-1.9 1.2-.9 2.1-2.1 2.8-3.4h.2c1.2 0 2.4-.4 3.1-1.5l.3-.5-.4-.3z"/></svg>Containers</h1><div id="list"></div></div>
<div id="shade"></div>
<div id="main">
  <div id="bar">
    <button id="menu" aria-label="Containers">☰</button>
    <span id="title">Select a container</span>
    <button id="opts" aria-label="Options"><svg viewBox="0 0 24 24"><path d="M3 6h11M18 6h3M3 12h3M10 12h11M3 18h11M18 18h3"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>Options</button>
    <input id="q" placeholder="Filter logs…" type="search" autocomplete="off">
    <div id="tools">
      <div id="sheethead"><span>Options</span><button id="optsclose" aria-label="Close">✕</button></div>
      <div id="ctl" hidden>
        <div class="ctlhead"><span class="dot" id="ctldot"></span><b id="ctlname"></b><span id="ctlstate"></span></div>
        <div class="ctlbtns">
          <button id="arestart" data-action="restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>Restart</button>
          <button id="astop" data-action="stop" class="danger"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>Stop</button>
          <button id="astart" data-action="start"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>Start</button>
        </div>
      </div>
      <label class="opt"><span>Lines</span><select id="tail" title="Lines to load"><option>100</option><option selected>200</option><option>1000</option><option>5000</option><option>20000</option><option value="all">all</option></select></label>
      <label class="opt"><span>Order</span><select id="order" title="Log order"><option value="bottom">Newest at bottom</option><option value="top">Newest on top</option></select></label>
      <label class="opt"><span>Level</span><select id="level" title="Minimum level"><option value="">All levels</option><option value="error">Errors</option><option value="warn">Warnings+</option><option value="info">Info+</option></select></label>
      <label class="opt"><span>Theme</span><select id="theme" title="Theme"><option value="dark">Dark</option><option value="black">Black</option><option value="white">White</option></select></label>
      <div class="opt zoomopt"><span>Text size</span><div class="zoom"><button id="zout" aria-label="Smaller text">A−</button><button id="zreset" title="Reset text size">100%</button><button id="zin" aria-label="Larger text">A+</button></div></div>
      <button id="color" class="on">Colors</button>
      <button id="wrap">Wrap</button>
      <button id="clear">Clear</button>
      <button id="dl">Download</button>
    </div>
    <span id="count"></span>
  </div>
  <div id="sheetshade"></div>
  <div id="logwrap"><div id="log"></div><button id="newer" hidden></button><div id="zoomtip"></div></div>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mbox">
      <h3 id="mtitle"></h3>
      <p id="mtext"></p>
      <div class="mbtns"><button id="mcancel">Cancel</button><button id="mok"></button></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
const store = {
  get(k, d) { try { const v = localStorage.getItem('dlv-' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dlv-' + k, v); } catch (e) {} },
};
let MAX = 100000;
let current = null, es = null, lines = [], pending = [], scheduled = false, query = '', listKey = '';
let colors = store.get('colors', '1') === '1';
let minLevel = store.get('level', '');

let actionsOn = false, actionBusy = false;
const states = {};

fetch('/api/config').then((r) => r.json()).then((c) => {
  if (c.maxLines) MAX = c.maxLines;
  actionsOn = !!c.actions;
  updateCtl();
}).catch(() => {});

async function loadList() {
  try {
    const r = await fetch('/api/containers');
    const list = await r.json();
    list.sort((a, b) => a.name.localeCompare(b.name));
    for (const k in states) delete states[k];
    for (const c of list) states[c.name] = { state: c.state, status: c.status };
    updateCtl();
    const key = JSON.stringify(list) + '\n' + current;
    if (key === listKey) return;
    listKey = key;
    $('list').innerHTML = '';
    for (const c of list) {
      const d = document.createElement('div');
      d.className = 'c' + (c.name === current ? ' sel' : '');
      d.innerHTML = '<div class="n"><span class="dot"></span><span></span></div><div class="s"></div>';
      if (/^[a-z]+$/.test(c.state)) d.querySelector('.dot').classList.add(c.state);
      d.querySelector('.n span:last-child').textContent = c.name;
      d.querySelector('.s').textContent = `${c.image} · ${c.status}`;
      d.onclick = () => { select(c.name); $('side').classList.remove('open'); };
      $('list').appendChild(d);
    }
  } catch (e) {}
}

const ANSI_RE = /\x1b\[([0-9;]*)m/g;
const ANY_ESC_RE = /\x1b\[[0-9;?]*[A-Za-z]/g;
const LEVEL_RE = /\b(FATAL|PANIC|CRIT(?:ICAL)?|EMERG|ALERT|ERROR|ERR|EXCEPTION|WARN(?:ING)?|INFO|NOTICE|DEBUG|TRACE)\b|\b[Ll][Ee][Vv][Ee][Ll]=["']?([A-Za-z]+)|"level"\s*:\s*"([A-Za-z]+)"|^\s*\[?([Ee]rror|[Ww]arn(?:ing)?|[Ii]nfo|[Dd]ebug|[Ff]atal)\]?:?\s/;
const TRACE_START_RE = /^(Traceback \(most recent call last\)|Exception in thread |panic: |Caused by: |Unhandled ?(?:exception|rejection))/i;
const CONT_RE = /^(\s+\S|\s*\^+\s*$|Traceback |During handling of the above exception|The above exception was the direct cause|[\w.]*(Error|Exception|Exit|Interrupt|Warning)\b|[A-Za-z_]\w*(?:\.\w+)*\.[A-Z]\w*:\s|Caused by:|goroutine \d+ )/;
let lastLv = null;
const LEVEL_MAP = { fatal:'fatal', panic:'fatal', crit:'fatal', critical:'fatal', emerg:'fatal', alert:'fatal', error:'error', err:'error', exception:'error', warn:'warn', warning:'warn', info:'info', notice:'info', debug:'debug', trace:'trace' };
const RANK = { trace:0, debug:0, info:1, warn:2, error:3, fatal:3 };
const TOKEN_RE = /(https?:\/\/[^\s"'<>]+)|("(?:[^"\\]|\\.)*")|\b(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\b|(?<=\s|^|")([1-5]\d\d)(?=\s|$|")|\b([A-Za-z_][\w.-]*)(?==)|\b(\d+(?:\.\d+)?(?:ms|s|µs|us|ns|kb|mb|gb|b)?)\b/gi;

function levelOf(text) {
  const m = LEVEL_RE.exec(text);
  if (!m) return null;
  return LEVEL_MAP[(m[1] || m[2] || m[3] || m[4]).toLowerCase()] || null;
}

function parseAnsi(raw) {
  if (raw.indexOf('\x1b') === -1) return null;
  const segs = [];
  let st = {}, last = 0, m;
  ANSI_RE.lastIndex = 0;
  while ((m = ANSI_RE.exec(raw))) {
    if (m.index > last) segs.push({ t: raw.slice(last, m.index), s: { ...st } });
    const codes = m[1] === '' ? [0] : m[1].split(';').map(Number);
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) st = {};
      else if (c === 1) st.b = 1; else if (c === 2) st.d = 1; else if (c === 3) st.i = 1; else if (c === 4) st.u = 1;
      else if (c === 22) { delete st.b; delete st.d; } else if (c === 23) delete st.i; else if (c === 24) delete st.u;
      else if (c >= 30 && c <= 37) st.fg = 'var(--a' + (c - 30) + ')';
      else if (c >= 90 && c <= 97) st.fg = 'var(--a' + (c - 82) + ')';
      else if (c === 39) delete st.fg;
      else if (c === 38 && codes[i + 1] === 5) { st.fg = xterm(codes[i + 2]); i += 2; }
      else if (c === 38 && codes[i + 1] === 2) { st.fg = `rgb(${codes[i + 2]},${codes[i + 3]},${codes[i + 4]})`; i += 4; }
      else if (c === 48 && (codes[i + 1] === 5 || codes[i + 1] === 2)) i += codes[i + 1] === 5 ? 2 : 4;
    }
    last = ANSI_RE.lastIndex;
  }
  if (last < raw.length) segs.push({ t: raw.slice(last), s: { ...st } });
  return segs.map((x) => ({ t: x.t.replace(ANY_ESC_RE, ''), s: x.s }));
}

function xterm(n) {
  if (n < 16) return 'var(--a' + n + ')';
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16;
  const f = (x) => (x ? x * 40 + 55 : 0);
  return `rgb(${f(Math.floor(n / 36))},${f(Math.floor(n / 6) % 6)},${f(n % 6)})`;
}

function appendText(el, text) {
  if (!query) { el.appendChild(document.createTextNode(text)); return; }
  const low = text.toLowerCase();
  let i = 0, j;
  while ((j = low.indexOf(query, i)) !== -1) {
    if (j > i) el.appendChild(document.createTextNode(text.slice(i, j)));
    const m = document.createElement('mark');
    m.textContent = text.slice(j, j + query.length);
    el.appendChild(m);
    i = j + query.length;
  }
  if (i < text.length) el.appendChild(document.createTextNode(text.slice(i)));
}

function span(parent, cls, text) {
  const s = document.createElement('span');
  s.className = cls;
  appendText(s, text);
  parent.appendChild(s);
}

function appendTokens(el, text) {
  let last = 0, m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text))) {
    if (m[0] === '') { TOKEN_RE.lastIndex++; continue; }
    if (m.index > last) appendLevels(el, text.slice(last, m.index));
    if (m[1]) span(el, 't-url', m[1]);
    else if (m[2]) span(el, 't-str', m[2]);
    else if (m[3]) span(el, 't-meth', m[3]);
    else if (m[4]) span(el, 't-s' + m[4][0], m[4]);
    else if (m[5]) span(el, 't-key', m[5]);
    else span(el, 't-num', m[6]);
    last = TOKEN_RE.lastIndex;
  }
  if (last < text.length) appendLevels(el, text.slice(last));
}

const LEVEL_WORD_RE = /\b(FATAL|PANIC|CRIT(?:ICAL)?|EMERG|ERROR|ERR|EXCEPTION|WARN(?:ING)?|INFO|NOTICE|DEBUG|TRACE)\b/g;
function appendLevels(el, text) {
  let last = 0, m;
  LEVEL_WORD_RE.lastIndex = 0;
  while ((m = LEVEL_WORD_RE.exec(text))) {
    if (m.index > last) appendText(el, text.slice(last, m.index));
    span(el, 'lv ' + LEVEL_MAP[m[1].toLowerCase()], m[1]);
    last = LEVEL_WORD_RE.lastIndex;
  }
  if (last < text.length) appendText(el, text.slice(last));
}

function prepare(item) {
  let raw = item.l;
  const sp = raw.indexOf(' ');
  if (sp > 20 && /^\d{4}-\d\d-\d\dT/.test(raw)) { item.ts = raw.slice(0, sp); raw = raw.slice(sp + 1); }
  item.ansi = parseAnsi(raw);
  item.text = item.ansi ? item.ansi.map((x) => x.t).join('') : raw;
  item.lv = item.s ? null : levelOf(item.text);
  if (!item.s) {
    if (item.lv) lastLv = item.lv;
    else if (lastLv && CONT_RE.test(item.text)) item.lv = lastLv;
    else if (item.text.trim()) lastLv = TRACE_START_RE.test(item.text) ? 'error' : null;
    if (!item.lv && TRACE_START_RE.test(item.text)) item.lv = 'error';
  }
  item.search = (item.ts ? item.ts + ' ' : '') + item.text.toLowerCase();
  return item;
}

function visible(item) {
  if (query && !item.search.includes(query)) return false;
  if (minLevel && !item.s) {
    const r = item.lv ? RANK[item.lv] : -1;
    if (r < RANK[minLevel]) return false;
  }
  return true;
}

function render(item) {
  if (!visible(item)) return null;
  const el = document.createElement('div');
  let cls = 'ln';
  if (item.s) cls += ' sys';
  else if (colors && item.lv) cls += ' lv-' + item.lv;
  if (item.s && item.e) cls += ' err';
  el.className = cls;
  if (item.ts) {
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.title = item.ts;
    const m = /^(\d{4}-\d\d-\d\dT)(\d\d:\d\d:\d\d)(.*)$/.exec(item.ts);
    if (m) span(ts, 'ts-date', m[1]), span(ts, '', m[2]), span(ts, 'ts-frac', m[3]);
    else appendText(ts, item.ts);
    el.appendChild(ts);
    el.appendChild(document.createTextNode(' '));
  }
  if (!colors || item.s) appendText(el, item.text);
  else if (item.ansi) {
    for (const seg of item.ansi) {
      if (!seg.t) continue;
      const s = document.createElement('span');
      const c = Object.keys(seg.s).filter((k) => k.length === 1);
      if (c.length) s.className = c.join(' ');
      if (seg.s.fg) s.style.color = seg.s.fg;
      appendText(s, seg.t);
      el.appendChild(s);
    }
  } else appendTokens(el, item.text);
  return el;
}

function updateCount() {
  $('count').textContent = lines.length ? `${lines.length.toLocaleString()} lines` + (lines.length >= MAX ? ' (oldest dropped)' : '') : '';
}

const CHUNK = 4000;
const PAGE = 300;
const DOM_CAP = 1500;
let seq = 0, cursor = 0, unseen = 0;

let order = store.get('logorder', 'bottom');
const newestTop = () => order === 'top';
const atEdge = () => (newestTop() ? logEl.scrollTop < 8 : logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 8);
const nearOldEnd = () => (newestTop() ? logEl.scrollTop + logEl.clientHeight > logEl.scrollHeight - 600 : logEl.scrollTop < 600);
const toEdge = () => { logEl.scrollTop = newestTop() ? 0 : logEl.scrollHeight; };
const baseSeq = () => (lines.length ? lines[0].seq : seq);

function trim() {
  const excess = lines.length - MAX;
  if (excess <= 0) return;
  const removed = lines.splice(0, excess);
  for (const it of removed) if (it.el) { it.el.remove(); it.el = null; }
  if (cursor < baseSeq()) cursor = baseSeq();
}

function renderEl(it) {
  it.el = render(it);
  if (it.el) it.el._seq = it.seq;
  return it.el;
}

function appendOlder(n) {
  const els = [];
  let i = cursor - baseSeq() - 1;
  for (; i >= 0 && els.length < n; i--) if (renderEl(lines[i])) els.push(lines[i].el);
  cursor = baseSeq() + i + 1;
  if (!els.length) return;
  if (newestTop()) {
    logEl.append(...els);
  } else {
    const before = logEl.scrollHeight;
    logEl.prepend(...els.reverse());
    logEl.scrollTop += logEl.scrollHeight - before;
  }
}

function addNewest(els) {
  if (newestTop()) logEl.prepend(...els.reverse());
  else logEl.append(...els);
}

function capDom() {
  if (logEl.childElementCount <= DOM_CAP) return;
  const oldEnd = () => (newestTop() ? logEl.lastElementChild : logEl.firstElementChild);
  while (logEl.childElementCount > DOM_CAP - PAGE) oldEnd().remove();
  cursor = oldEnd()._seq;
}

function setUnseen(n) {
  unseen = n;
  $('newer').hidden = !n;
  $('newer').textContent = `${newestTop() ? '↑' : '↓'} ${n.toLocaleString()} new line${n === 1 ? '' : 's'}`;
}

function rebuild() {
  logEl.textContent = '';
  cursor = seq;
  appendOlder(PAGE);
  while (cursor > baseSeq() && logEl.scrollHeight < logEl.clientHeight + 600) appendOlder(PAGE);
  toEdge();
  setUnseen(0);
}

function setOrder(o) {
  order = o === 'top' ? 'top' : 'bottom';
  $('order').value = order;
  store.set('logorder', order);
  logEl.parentElement.classList.toggle('asc', !newestTop());
  rebuild();
}

function schedule() {
  if (scheduled) return;
  scheduled = true;
  setTimeout(flush, 30);
}

function flush() {
  scheduled = false;
  if (!pending.length) return;
  const batch = pending.length > CHUNK ? pending.splice(0, CHUNK) : pending;
  if (batch === pending) pending = [];
  else schedule();
  const items = [];
  for (const raw of batch) {
    const it = prepare(raw);
    it.seq = seq++;
    lines.push(it);
    items.push(it);
  }
  trim();
  updateCount();
  if (!atEdge()) {
    setUnseen(unseen + items.filter(visible).length);
    return;
  }
  if (items.length >= PAGE || unseen) { rebuild(); return; }
  const els = [];
  for (const it of items) if (it.seq >= baseSeq() && renderEl(it)) els.push(it.el);
  if (els.length) addNewest(els);
  capDom();
  toEdge();
}

function add(item) {
  pending.push(item);
  schedule();
}

function redraw() {
  rebuild();
}

function reset() {
  lines = []; pending = []; lastLv = null; cursor = seq; logEl.textContent = ''; setUnseen(0); updateCount();
}

logEl.addEventListener('scroll', () => {
  if (unseen && atEdge()) rebuild();
  else if (cursor > baseSeq() && nearOldEnd()) appendOlder(PAGE);
}, { passive: true });

function select(name) {
  current = name; reset(); $('title').textContent = name;
  if (es) es.close();
  const src = new EventSource(`/api/logs?name=${encodeURIComponent(name)}&tail=${$('tail').value}`);
  es = src;
  src.onmessage = (m) => {
    if (es !== src) return;
    for (const [l, e] of JSON.parse(m.data)) add({ l, e: !!e });
  };
  src.addEventListener('end', () => { src.close(); add({ l: '— stream ended —', s: true }); });
  src.addEventListener('fail', (m) => { src.close(); add({ l: '— error: ' + JSON.parse(m.data) + ' —', e: true, s: true }); });
  loadList();
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').value = t;
  store.set('theme', t);
}

let qTimer = null;
$('q').oninput = () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = $('q').value.toLowerCase(); redraw(); }, 150);
};
$('tail').value = store.get('tail', '200');
$('tail').onchange = () => { store.set('tail', $('tail').value); if (current) select(current); };
$('level').value = minLevel;
$('level').onchange = () => { minLevel = $('level').value; store.set('level', minLevel); redraw(); };
setTheme(document.documentElement.dataset.theme);
$('theme').onchange = () => setTheme($('theme').value);
$('color').classList.toggle('on', colors);
$('color').onclick = () => { colors = !colors; store.set('colors', colors ? '1' : '0'); $('color').classList.toggle('on', colors); redraw(); };
if (store.get('wrap', matchMedia('(max-width:700px)').matches ? '1' : '0') === '1') { logEl.classList.add('wrap'); $('wrap').classList.add('on'); }
$('wrap').onclick = () => { const on = logEl.classList.toggle('wrap'); $('wrap').classList.toggle('on', on); store.set('wrap', on ? '1' : '0'); };
$('newer').onclick = rebuild;

const BASE_FS = 12, MIN_FS = 7, MAX_FS = 28;
let logFs = parseFloat(store.get('fontsize', String(BASE_FS))) || BASE_FS;
let tipTimer = null;

function setFontSize(px, cx, cy, save = true) {
  px = Math.round(Math.min(MAX_FS, Math.max(MIN_FS, px)) * 10) / 10;
  if (px === logFs) return;
  const ratio = px / logFs;
  const r = logEl.getBoundingClientRect();
  const ox = cx === undefined ? 0 : cx - r.left;
  const oy = cy === undefined ? 0 : cy - r.top;
  const sx = logEl.scrollLeft, sy = logEl.scrollTop;
  logFs = px;
  logEl.style.setProperty('--logfs', px + 'px');
  logEl.scrollTop = (sy + oy) * ratio - oy;
  logEl.scrollLeft = (sx + ox) * ratio - ox;
  const pct = Math.round((px / BASE_FS) * 100) + '%';
  $('zreset').textContent = pct;
  $('zoomtip').textContent = pct;
  $('zoomtip').classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => $('zoomtip').classList.remove('show'), 700);
  if (save) store.set('fontsize', String(px));
}

logEl.style.setProperty('--logfs', logFs + 'px');
$('zreset').textContent = Math.round((logFs / BASE_FS) * 100) + '%';
$('zin').onclick = () => setFontSize(logFs + 1);
$('zout').onclick = () => setFontSize(logFs - 1);
$('zreset').onclick = () => setFontSize(BASE_FS);

let pinch = null, pinchFrame = 0;
const touchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
logEl.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) pinch = { d: touchDist(e.touches), fs: logFs };
}, { passive: true });
logEl.addEventListener('touchmove', (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const t = e.touches;
  const target = pinch.fs * (touchDist(t) / pinch.d);
  const cx = (t[0].clientX + t[1].clientX) / 2, cy = (t[0].clientY + t[1].clientY) / 2;
  cancelAnimationFrame(pinchFrame);
  pinchFrame = requestAnimationFrame(() => setFontSize(target, cx, cy, false));
}, { passive: false });
logEl.addEventListener('touchend', (e) => {
  if (pinch && e.touches.length < 2) { pinch = null; store.set('fontsize', String(logFs)); }
});
logEl.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setFontSize(logFs * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY);
}, { passive: false });
logEl.addEventListener('gesturestart', (e) => e.preventDefault());

const ACTION_TEXT = {
  restart: { verb: 'restart', title: 'Restart container?', ok: 'Restart', busy: 'Restarting…', done: 'restarted', danger: true },
  stop: { verb: 'stop', title: 'Stop container?', ok: 'Stop', busy: 'Stopping…', done: 'stopped', danger: true },
  start: { verb: 'start', title: 'Start container?', ok: 'Start', busy: 'Starting…', done: 'started', danger: false },
};

function updateCtl() {
  const s = current && states[current];
  $('ctl').hidden = !actionsOn || !current;
  if ($('ctl').hidden) return;
  const state = s ? s.state : 'unknown';
  const up = state === 'running' || state === 'restarting' || state === 'paused';
  $('ctlname').textContent = current;
  $('ctlstate').textContent = s ? s.status : '';
  $('ctldot').className = 'dot' + (/^[a-z]+$/.test(state) ? ' ' + state : '');
  $('astop').hidden = !up;
  $('astart').hidden = up;
  for (const b of $('ctl').querySelectorAll('button')) b.disabled = actionBusy;
}

let toastTimer = null;
function toast(msg, bad) {
  $('toast').textContent = msg;
  $('toast').classList.toggle('bad', !!bad);
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), bad ? 5000 : 2500);
}

let modalResolve = null;
function confirmBox(title, html, okLabel, danger) {
  $('mtitle').textContent = title;
  $('mtext').innerHTML = html;
  $('mok').textContent = okLabel;
  $('mok').classList.toggle('danger', danger);
  $('modal').hidden = false;
  $('mcancel').focus();
  return new Promise((resolve) => { modalResolve = resolve; });
}
function closeModal(result) {
  if ($('modal').hidden) return;
  $('modal').hidden = true;
  if (modalResolve) { modalResolve(result); modalResolve = null; }
}
$('mcancel').onclick = () => closeModal(false);
$('mok').onclick = () => closeModal(true);
$('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(false); };

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function runAction(action) {
  const name = current;
  if (!name || actionBusy) return;
  const t = ACTION_TEXT[action];
  if (action !== 'start') {
    const ok = await confirmBox(t.title, `Are you sure you want to ${t.verb} this container <b>${escapeHtml(name)}</b>?`, t.ok, t.danger);
    if (!ok) return;
  }
  actionBusy = true;
  const btn = $('a' + action);
  const label = btn.lastChild.textContent;
  btn.lastChild.textContent = t.busy;
  updateCtl();
  try {
    const r = await fetch(`/api/containers/${encodeURIComponent(name)}/${action}`, { method: 'POST', headers: { 'X-DLV-Action': '1' } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    toast(`${name} ${t.done}`);
    if (action !== 'stop' && current === name) setTimeout(() => { if (current === name) select(name); }, 600);
  } catch (e) {
    toast(`Could not ${t.verb} ${name}: ${e.message}`, true);
  } finally {
    actionBusy = false;
    btn.lastChild.textContent = label;
    listKey = '';
    loadList();
  }
}
for (const b of document.querySelectorAll('#ctl button')) b.onclick = () => runAction(b.dataset.action);

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('modal').hidden) closeModal(false);
  else document.body.classList.remove('sheet');
});
$('order').onchange = () => setOrder($('order').value);
setOrder(order);
const sheet = (on) => document.body.classList.toggle('sheet', on);
$('opts').onclick = () => sheet(true);
$('optsclose').onclick = () => sheet(false);
$('sheetshade').onclick = () => sheet(false);
$('dl').addEventListener('click', () => sheet(false));
$('clear').addEventListener('click', () => sheet(false));
$('clear').onclick = reset;
$('menu').onclick = () => $('side').classList.toggle('open');
$('shade').onclick = () => $('side').classList.remove('open');
if (matchMedia('(max-width:700px)').matches && !current) $('side').classList.add('open');
$('dl').onclick = () => {
  const blob = new Blob([lines.filter((x) => !x.s).map((x) => (x.ts ? x.ts + ' ' : '') + x.text).join('\n')], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (current || 'logs') + '.log'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
loadList(); setInterval(loadList, 5000);
</script>
</body>
</html>
